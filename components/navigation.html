            <script defer="" data-name="navigation-logic">
              document.addEventListener('DOMContentLoaded', function() {
                (function(){
                  const mobileToggle = document.getElementById("mobile-toggle")
                  const mobileMenu = document.getElementById("mobile-menu")
                  const mobileClose = document.getElementById("mobile-close")
                  const mobileLinks = document.querySelectorAll(".navigation-mobile-link")

                  const openMenu = () => {
                    mobileMenu.showModal()
                    document.body.style.overflow = "hidden"
                    mobileToggle.setAttribute("aria-expanded", "true")
                  }

                  const closeMenu = () => {
                    mobileMenu.close()
                    document.body.style.overflow = ""
                    mobileToggle.setAttribute("aria-expanded", "false")
                  }

                  mobileToggle.addEventListener("click", openMenu)
                  mobileClose.addEventListener("click", closeMenu)

                  // Close menu when a link is clicked
                  mobileLinks.forEach((link) => {
                    link.addEventListener("click", closeMenu)
                  })

                  // Close on backdrop click (native dialog behavior enhancement)
                  mobileMenu.addEventListener("click", (e) => {
                    const dialogDimensions = mobileMenu.getBoundingClientRect()
                    if (e.clientX < dialogDimensions.left || e.clientX > dialogDimensions.right || e.clientY < dialogDimensions.top || e.clientY > dialogDimensions.bottom) {
                      closeMenu()
                    }
                  })

                  // Handle escape key specifically for state management
                  mobileMenu.addEventListener("cancel", (e) => {
                    document.body.style.overflow = ""
                    mobileToggle.setAttribute("aria-expanded", "false")
                  })
                })()
              });
            </script>
          </div>
        </div>
